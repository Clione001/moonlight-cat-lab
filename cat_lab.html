/* 引入像素中文字体，保证中文风格统一 */
@import url('https://cdn.jsdelivr.net/npm/zpix@1.0.2/dist/zpix.css');

body {
    /* 1. 象牙白背景：模拟旧纸张颜色 */
    background-color: #f4f1ea;

    background-size: 20px 20px;

    /* 2. 英伦衬线与像素中文结合 */
    font-family: "zpix", "Georgia", "Times New Roman", serif;
    -webkit-font-smoothing: none;
    image-rendering: pixelated;
    
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    line-height: 1.6;
}

.lab-card {
    background: #ffffff;
    /* 3. 星露谷风格：深炭黑的像素浮雕边框 */
    border: 3px solid #1a1a1a;
    box-shadow: 
        2px 2px 0px #d1ccc0, /* 浅色外影 */
        4px 4px 0px #1a1a1a, /* 深色主影 */
        inset 1px 1px 0px rgba(0,0,0,0.05);
    padding: 30px;
    max-width: 500px;
    width: 100%;
}

h1 {
    font-family: "Georgia", serif;
    font-size: 22px;
    font-style: italic;
    color: #000000;
    text-align: center;

    letter-spacing: 3px;
    text-transform: uppercase;
    border-bottom: 2px solid #1a1a1a;
    padding-bottom: 10px;
}

.sensor-btn {
    background: #ffffff;
    border: 2px solid #1a1a1a;
    color: #1a1a1a;
    padding: 12px 15px;
    margin: 10px 0;
    width: 100%;
    cursor: pointer;
    font-family: inherit;
    font-size: 15px;
    font-weight: bold;
    text-align: left;
    /* 像素方块按压感 */
    box-shadow: 2px 2px 0px #1a1a1a;
    transition: all 0.1s;
}

.sensor-btn:hover {
    background: #1a1a1a;
    color: #ffffff;
    transform: translate(1px, 1px);
    box-shadow: 1px 1px 0px #1a1a1a;
}

/* 屏幕显示区：模拟旧公文的盖印感 */
#screen {
    background: #fdfdfd;
    border: 1px dashed #1a1a1a;
    padding: 20px;
    margin-top: 20px;
    min-height: 60px;
    font-family: "Georgia", serif;
    font-style: italic;
    color: #333333;
    /* 增加一个微弱的左侧红边，像笔记本的装订线 */
    border-left: 4px solid #cc0000;
}

/* 底部状态区 */
.lunar-stats {
    margin-top: 30px;
    font-size: 12px;
    color: #666666;
    border-top: 1px solid #eeeeee;
    padding-top: 15px;
    font-family: "Georgia", serif;
}

<script>
    function decode(type) {
        const screen = document.getElementById('display');
        if(type === 'shout') {
            screen.innerHTML = "<span class='logic-label'>[逻辑解构]：</span> 正在进行领地声呐扫描。探测到人类不可感知的环境扰动。";
        } else if(type === 'stare') {
            screen.innerHTML = "<span class='logic-label'>[逻辑解构]：</span> 视觉超频模式开启。正在锁定0.01mm级别的动态颗粒。";
        } else if(type === 'tail') {
            screen.innerHTML = "<span class='logic-label'>[逻辑解构]：</span> 后台模拟训练中。神经系统正在同步狩猎动作指令。";
        }
        else if(type === 'run') {
    screen.innerHTML = "<span class='logic-label'>[逻辑解构]：</span> 正在执行‘猎食模拟’或‘寄生虫防御演习’。核心心率瞬间提升以排泄冗余肾上腺素。";
}else if(type === 'run') {
            screen.innerHTML = "<span class='logic-label'>[逻辑解构]：</span> 瞬时动能过载释放。正在执行‘猎食模拟’演习，核心心率瞬间提升以排泄冗余肾上腺素。";
        } else if(type === 'nose') {
            // 这里是新加的鼻子逻辑
            screen.innerHTML = "<span class='logic-label'>[逻辑解构]：</span> 嗅觉传感器受到外部油脂干扰。正在执行‘液态自清洁协议’，以恢复鼻尖湿润度及气味分子捕捉精度。";
        }
    }
</script>
