        .lab-card { background: white; width: 400px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #e0e6ed; }

        .sensor-btn { background: #fdfdfd; border: 1px solid #eee; width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; cursor: pointer; text-align: left; transition: 0.3s; color: #555; }
        .sensor-btn:hover { background: #00d1b2; color: white; border-color: #00d1b2; }
        #display { margin-top: 20px; padding: 20px; background: #fafafa; border-radius: 10px; min-height: 80px; font-size: 14px; line-height: 1.6; color: #666; border-left: 4px solid #ddd; }

<body>

<div class="lab-card">

    <p style="font-size: 12px; color: #999;">请选择观测到的物理行为：</p>
    
    <button class="sensor-btn" onclick="decode('shout')">◈ 捕捉到自发性音频广播 (大叫)</button>
    <button class="sensor-btn" onclick="decode('stare')">◈ 视觉传感器长时间锁定 (盯着虚空)</button>

   <button class="sensor-btn" style="opacity: 0.5; cursor: not-allowed;">

</button>

    </p>
    
    <div style="width: 100%; height: 2px; background: rgba(0,209,178,0.1); border-radius: 2px;">

        📡 [通讯链路已建立]：正在等待地球端的信号反馈...

    <div style="height: 100px; display: flex; align-items: center; justify-content: center; border: 1px dashed #444;">

<script>
    function decode(type) {
        const screen = document.getElementById('display');
        if(type === 'shout') {
            screen.innerHTML = "<span class='logic-label'>[逻辑解构]：</span> 正在进行领地声呐扫描。探测到人类不可感知的环境扰动。";
        } else if(type === 'stare') {
            screen.innerHTML = "<span class='logic-label'>[逻辑解构]：</span> 视觉超频模式开启。正在锁定0.01mm级别的动态颗粒。";
        } else if(type === 'tail') {
            screen.innerHTML = "<span class='logic-label'>[逻辑解构]：</span> 后台模拟训练中。神经系统正在同步狩猎动作指令。";
        }
        else if(type === 'run') {
    screen.innerHTML = "<span class='logic-label'>[逻辑解构]：</span> 正在执行‘猎食模拟’或‘寄生虫防御演习’。核心心率瞬间提升以排泄冗余肾上腺素。";
}else if(type === 'run') {
            screen.innerHTML = "<span class='logic-label'>[逻辑解构]：</span> 瞬时动能过载释放。正在执行‘猎食模拟’演习，核心心率瞬间提升以排泄冗余肾上腺素。";
        } else if(type === 'nose') {
            // 这里是新加的鼻子逻辑
            screen.innerHTML = "<span class='logic-label'>[逻辑解构]：</span> 嗅觉传感器受到外部油脂干扰。正在执行‘液态自清洁协议’，以恢复鼻尖湿润度及气味分子捕捉精度。";
        }
    }
</script>
